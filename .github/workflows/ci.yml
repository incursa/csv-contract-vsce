name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - run: npm run package:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: csv-contract-vsce
          path: csv-contract-vsce.vsix
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:production
      - name: PowerShell 7 suite
        shell: pwsh
        run: ./scripts/Test-PowerShellSuite.ps1
      - name: Windows PowerShell 5.1 suite
        shell: powershell
        run: ./scripts/Test-PowerShellSuite.ps1
